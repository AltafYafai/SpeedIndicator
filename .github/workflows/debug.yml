name: SpeedIndicator Debug

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Notify build start
        continue-on-error: true
        run: python3 .github/scripts/telegram_bot.py start

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Notify environment ready
        continue-on-error: true
        run: python3 .github/scripts/telegram_bot.py stage done env "Environment ready (JDK 17, Gradle)"

      - name: Restore debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: speedindicator-debug-keystore-v1

      - name: Prepare debug environment
        run: python3 .github/scripts/debug.py prepare

      - name: Notify keystore ready
        continue-on-error: true
        run: python3 .github/scripts/telegram_bot.py stage done keystore "Debug keystore ready"

      - name: Notify Gradle started
        continue-on-error: true
        run: python3 .github/scripts/telegram_bot.py stage active gradle "Gradle assembleDebug running…"

      - name: Build debug APK
        run: python3 .github/scripts/debug.py build

      - name: Notify Gradle done
        continue-on-error: true
        run: python3 .github/scripts/telegram_bot.py stage done gradle "Gradle assembleDebug done"

      - name: Package debug APK
        run: python3 .github/scripts/debug.py package

      - name: Notify APK packaged
        continue-on-error: true
        run: python3 .github/scripts/telegram_bot.py stage done package "APK packaged"

      - name: Notify upload started
        continue-on-error: true
        run: python3 .github/scripts/telegram_bot.py stage active upload "Uploading APK to Telegram…"

      - name: Send debug APK to Telegram
        run: python3 .github/scripts/telegram_bot.py apk "SpeedIndicator-debug-${GITHUB_SHA:0:7}.apk"

      - name: Notify failure
        if: failure()
        continue-on-error: true
        run: python3 .github/scripts/telegram_bot.py failure "Build failed — see workflow logs for details"
