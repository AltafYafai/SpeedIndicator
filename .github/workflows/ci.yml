name: SpeedIndicator CI

on:
  push:
    branches:
      - main
      - fix/contribution-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Every push/PR triggers the full debug pipeline: build, package,
# live Telegram progress and automatic APK upload (no-op on forks,
# which don't get secrets). Manual runs live in debug.yml.
jobs:
  debug-build:
    uses: ./.github/workflows/debug.yml
    secrets: inherit
